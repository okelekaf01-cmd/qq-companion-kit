name: Check installer
on: [push, pull_request, workflow_dispatch]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm test
      - run: bash -n install-linux.sh
      - name: Validate Compose
        run: |
          for key in ONEBOT_TOKEN WEBUI_TOKEN SETUP_TOKEN CONSOLE_TOKEN; do
            echo "$key=$(openssl rand -hex 32)" >> .env
          done
          docker compose config --quiet
      - name: Build pinned runtime
        run: docker compose build agent
      - name: Start without QQ login
        run: |
          docker compose up -d
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18670/ping; then exit 0; fi
            sleep 5
          done
          docker compose logs --tail 120
          exit 1
      - name: Verify private setup and empty allowlist
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18670/links)" = 403
          docker compose exec -T agent node /opt/kit/smoke-check.mjs
      - if: always()
        run: docker compose down
