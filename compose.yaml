name: qq-companion-kit
x-agent: &agent-image
  image: qq-companion-kit-agent:0.1.0
  build:
    context: .
    dockerfile: docker/Dockerfile
  platform: linux/amd64
x-tokens: &tokens
  ONEBOT_TOKEN: ${ONEBOT_TOKEN:?Run the installer first}
  WEBUI_TOKEN: ${WEBUI_TOKEN:?Run the installer first}
  SETUP_TOKEN: ${SETUP_TOKEN:?Run the installer first}
  CONSOLE_TOKEN: ${CONSOLE_TOKEN:?Run the installer first}
services:
  init:
    <<: *agent-image
    user: root
    command: [node, /opt/kit/initialize.mjs]
    environment: *tokens
    volumes:
      - agent_data:/data
      - qq_config:/qq-config
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
  qq:
    image: mlikiowa/napcat-docker:v4.18.41@sha256:b101b8968cc31ae428ec0f8e117386e4ced7773b2d8226ed9f7ddfcec55f1b7e
    platform: linux/amd64
    restart: unless-stopped
    init: true
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      TZ: Asia/Shanghai
      NAPCAT_UID: 1000
      NAPCAT_GID: 1000
      NAPCAT_ENABLE_COREDUMP: 0
    ports: ["127.0.0.1:18699:6099"]
    volumes:
      - qq_login:/app/.config/QQ
      - qq_config:/app/napcat/config
      - qq_plugins:/app/napcat/plugins
    networks: [qqnet]
    mem_limit: 1024m
    shm_size: 128m
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
  agent:
    <<: *agent-image
    restart: unless-stopped
    init: true
    depends_on:
      init: {condition: service_completed_successfully}
      qq: {condition: service_started}
    environment:
      <<: *tokens
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18670:8080"
      - "127.0.0.1:18680:18080"
      - "127.0.0.1:18610:13100"
    volumes: [agent_data:/data]
    networks: [qqnet]
    read_only: true
    tmpfs: ["/tmp:size=192m,mode=1777,exec"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 4
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
networks:
  qqnet:
volumes:
  agent_data:
  qq_login:
  qq_config:
  qq_plugins:
